global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend live_streams
    bind *:20000
    mode http

    acl is_options method OPTIONS
    http-request return status 204 content-type "text/plain" hdr "Access-Control-Allow-Origin" "*" hdr "Access-Control-Allow-Methods" "GET, POST, OPTIONS" hdr "Access-Control-Allow-Headers" "Authorization, Content-Type, Origin, Accept" if is_options

    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "Authorization, Content-Type, Origin, Accept"

    default_backend node_servers

backend node_servers
    mode http
    balance roundrobin
    server nms1 nms_server1:8001 check
    server nms2 nms_server2:8002 check
    server nms3 nms_server3:8003 check








