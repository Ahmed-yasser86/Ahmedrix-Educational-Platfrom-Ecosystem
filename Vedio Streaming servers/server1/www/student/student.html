<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشاهدة الحصة - الطالب</title>
    <script src="https://cdn.bootcss.com/flv.js/1.5.0/flv.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; }
        .video-container { width: 80%; margin: auto; max-width: 800px; }
        video { width: 100%; border: 2px solid #333; border-radius: 8px; }
        .live-tag { background: red; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>بث المدرس المباشر <span class="live-tag">LIVE</span></h2>
    
    <div class="video-container">
        <video id="videoElement" controls autoplay muted></video>
    </div>

    <script>
        if (flvjs.isSupported()) {
            var videoElement = document.getElementById('videoElement');
            var flvPlayer = flvjs.createPlayer({
                type: 'flv',
                // هنسحب البث من السيرفر الأول (أو تقدر تغيره لسيرفر 2 أو 3 للتجربة)
                url: 'http://localhost:8001/live/stream1.flv'
            });
            flvPlayer.attachMediaElement(videoElement);
            flvPlayer.load();
            flvPlayer.play();
        }
    </script>
</body>
</html>
