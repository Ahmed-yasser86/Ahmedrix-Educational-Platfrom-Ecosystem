global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend chat_front
    bind *:9999
    default_backend chat_nodes

backend chat_nodes
    balance roundrobin
    option http-server-close
    server node1 chat-app-1:3141 check
    server node2 chat-app-2:3141 check
    server node3 chat-app-3:3141 check












